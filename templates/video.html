<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Detection Live Stream</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            background:white;

            width:650px;
            max-width:90%;

            padding:25px;

            border-radius:15px;

            text-align:center;

            box-shadow:
            0px 5px 20px rgba(
                0,0,0,0.15
            );
        }

        h1{
            color:#2c3e50;
            margin-bottom:20px;
            font-size:28px;
        }

        .upload-section{
            margin-bottom:20px;
        }

        input[type=file]{
            padding:10px;
        }

        button{
            margin-top:15px;

            background:#28a745;
            color:white;

            border:none;

            padding:10px 25px;

            border-radius:8px;

            cursor:pointer;

            font-size:15px;
        }

        button:hover{
            background:#218838;
        }

        .video-container{
            margin-top:20px;
        }

        img{

            width:500px;
            max-width:100%;

            height:auto;

            display:block;

            margin:auto;

            border-radius:10px;

            border:2px solid #ddd;

            box-shadow:
            0px 0px 10px rgba(
                0,0,0,0.12
            );
        }

        h2{
            margin-bottom:15px;
            color:#34495e;
            font-size:20px;
        }

        .info{
            margin-top:10px;
            color:#666;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
♻️ Real-Time Waste Detection
</h1>

<div class="upload-section">

<form
method="POST"
action="/upload"
enctype="multipart/form-data">

<input
type="file"
name="video"
accept="video/*"
required>

<br>

<button type="submit">
Detect Waste
</button>

</form>

</div>

{% if start_stream %}

<div class="video-container">

<h2>
Live Detection Stream
</h2>

<img src="/video_feed">

<p class="info">
YOLOv5 is processing the video frame-by-frame.
</p>

</div>

{% endif %}

</div>

</div>

</body>

</html>
